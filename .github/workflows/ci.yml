name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds the candidate main and needs every required check
  # to report on it, or a queued pull request never merges.
  merge_group:

permissions:
  contents: read

# A push that supersedes another on the same branch makes the older run's
# result irrelevant; letting it finish only burns minutes and cache writes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    # macOS is here because the systemd client is Linux-only behind
    # cfg(target_os), and a Linux-only run never compiles the other side
    #
    # The check is named after the platform, not the runner label: branch
    # protection requires it by name, so pinning a new image must not rename it.
    name: fmt + clippy + tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with rust-version in Cargo.toml
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked

  docker:
    name: container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          # Only main writes layers. buildx never deletes what it wrote, so
          # writing from every pull request fills the repository's 10 GB cache
          # and GitHub starts evicting the Rust caches the other jobs need.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
