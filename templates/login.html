{% extends "base.html" %}
{% block title %}Log in · {% endblock %}
{% block content %}
<div class="center">
  <section class="panel auth-card" aria-labelledby="login-title">
    <h1 id="login-title" class="panel-title">Log in</h1>
    <p class="muted">The operator password is needed to post incidents and maintenance.</p>
    {% if let Some(e) = error %}<p class="alert" role="alert">{{ e }}</p>{% endif %}
    <form method="post" action="/login" class="form">
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
      </div>
      <button class="button primary block" type="submit">Log in</button>
    </form>
  </section>
</div>
{% endblock %}
