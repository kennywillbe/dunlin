{% extends "base.html" %}
{% block title %}Log in · {% endblock %}
{% block content %}
<section class="plain-page" aria-labelledby="login-title">
  <h2 id="login-title" class="form-title">Operator password</h2>
  {% if let Some(e) = error %}<p class="alert" role="alert">{{ e }}</p>{% endif %}
  <form method="post" action="/login" class="form narrow-form">
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
    </div>
    <div class="actions"><button class="button primary" type="submit">Log in</button></div>
  </form>
</section>
{% endblock %}
