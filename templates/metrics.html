{% extends "base.html" %}
{% block title %}Metrics{% endblock %}
{% block content %}
<h1>Metrics</h1>
<div class="chart-controls">
  <label>Series
    <select id="series">
      {% for s in series %}<option value="{{ s.index }}">{{ s.label }}</option>{% endfor %}
    </select>
  </label>
  <label>Range
    <select id="range">
      <option value="24h" selected>24 hours</option>
      <option value="7d">7 days</option>
      <option value="90d">90 days</option>
    </select>
  </label>
</div>
<div id="chart" class="chart"></div>
<p class="muted small" id="chart-note"></p>

<script src="/assets/uplot.js"></script>
<script>
  var SERIES = {{ series_json|safe }};
  var chart = null;

  function load() {
    var idx = parseInt(document.getElementById("series").value, 10) || 0;
    var s = SERIES[idx];
    var range = document.getElementById("range").value;
    var url = "/api/metrics?scope=" + encodeURIComponent(s.scope) +
              "&metric=" + encodeURIComponent(s.metric) +
              "&key=" + encodeURIComponent(s.key) +
              "&range=" + encodeURIComponent(range);
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      var note = document.getElementById("chart-note");
      note.textContent = data.points + " points, unit: " + data.unit;
      var opts = {
        width: document.getElementById("chart").clientWidth || 800,
        height: 280,
        series: [{}, { label: s.label, stroke: "#58a6ff" }],
        axes: [{}, { label: data.unit }]
      };
      if (chart) { chart.destroy(); }
      chart = new uPlot(opts, [data.t, data.v], document.getElementById("chart"));
    });
  }

  document.getElementById("series").addEventListener("change", load);
  document.getElementById("range").addEventListener("change", load);
  window.addEventListener("load", load);
  window.addEventListener("resize", function () { if (chart) { chart.destroy(); chart = null; load(); } });
</script>
{% endblock %}
